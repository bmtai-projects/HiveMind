# Copy to ~/.config/hivemind/config.toml (or pass --config path/to/this).
# Every field is optional — the harness works with only $HIVEMIND_API_KEY set,
# or `hivemind auth login` for hosted mode (no key needed at all).

[model]
# api_key = "sk-..."        # prefer $HIVEMIND_API_KEY; only set this for local experiments
# base_url = "https://api.deepseek.com"
# model = "hivemind"        # hosted mode: "hivemind" (default) or one of the 6 real coding
                             # models `hivemind models` lists; BYOK: a model id your own
                             # provider key recognizes (e.g. "deepseek-v4-pro")
# reasoning_effort = "high" # off by default (reasoning-capable models cost more / run slower).
                             # Valid values differ per model -- `hivemind models` lists them,
                             # or run `/reasoning` with no argument in the REPL. Silently not
                             # sent if the active model doesn't support the value you set.

[agent]
max_turns = 60                      # hard cap on sample<->tool cycles per input (one turn can batch several tool calls)
compaction_threshold_percent = 75   # summarize older turns once usage crosses this % of the context window
auto_escalate = true                # bump off "hivemind" after repeated/failing tool calls on one task
escalate_to_model = "claude-sonnet-5" # model to escalate to (only fires while "hivemind" is active)
escalate_after_repeats = 2          # consecutive repeats/errors before escalating
# budget_usd = 0.50                 # unbounded by default. Stops the session (cleanly, not an
                                     # error) once estimated spend reaches this, at the next turn
                                     # boundary -- an in-flight turn always finishes first.

# For common cases -- "never let it force-push", "only let it write inside
# src/" -- you don't need to write any of the below by hand. Run:
#   hivemind hooks list             # see what's available
#   hivemind hooks enable <preset>  # turn one on
# It writes a [[hooks]] block just like the ones below into this exact
# file. Hand-write your own hook (below) only for something a preset
# doesn't cover.
#
# Zero or more hooks. `event` is "pre_tool_use" (can block a call before it
# runs) or "post_tool_use" (observes after; can't block). `matcher` limits
# which tool names it applies to — omit it to match every tool. `command`
# is spawned the same way run_shell spawns (bash -lc on Unix, cmd /C on
# Windows), with a JSON envelope on its stdin: {event, tool_name, tool_args,
# tool_result?, workspace_root}. A hook denies by either printing
# {"decision":"deny","reason":"..."} to stdout, or exiting 2 (matching
# Claude Code's own hook convention) with no output.
#
# By default any other outcome — a crash, a bad exit code, a timeout —
# allows the call through, so a broken hook can never wedge the agent.
# That is the right default for linters, formatters, and notifications.
#
# `enforcement = true` inverts exactly that: a hook that fails to produce a
# verdict denies instead. Use it for hooks that are actually a control
# rather than a convenience — a "block writes outside the sandbox" script
# that silently permits everything the moment it has a typo is not
# protecting anything. It is meaningful on pre_tool_use only; a
# post_tool_use hook observes work that has already happened.
#
# [[hooks]]
# name = "block-force-push"
# event = "pre_tool_use"
# matcher = ["run_shell"]
# command = 'grep -q "push --force" && exit 2 || exit 0'
# timeout_ms = 5000
#
# [[hooks]]
# name = "no-writes-outside-src"
# event = "pre_tool_use"
# matcher = ["write_file", "edit_file"]
# command = 'jq -e ".tool_args | fromjson | .path | startswith(\"src/\")" > /dev/null || exit 2'
# enforcement = true
