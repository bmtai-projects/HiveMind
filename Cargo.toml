[workspace]
resolver = "2"
members = [
    "crates/harness-types",
    "crates/harness-config",
    "crates/harness-provider",
    "crates/harness-tools",
    "crates/harness-agent",
    "crates/harness-cli",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT"
authors = ["Bibhabendu Mukherjee <mukherjee4004@gmail.com>"]
repository = "https://github.com/BibhabenduMukherjee/HiveMind"

[workspace.dependencies]
harness-types = { path = "crates/harness-types" }
harness-config = { path = "crates/harness-config" }
harness-provider = { path = "crates/harness-provider" }
harness-tools = { path = "crates/harness-tools" }
harness-agent = { path = "crates/harness-agent" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "io-util", "io-std", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
rand = "0.9"
reedline = "0.38"
walkdir = "2"
open = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
