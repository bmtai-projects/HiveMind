name: Bug report
description: Something is broken, or does not behave the way you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A few details help us fix it faster.

        **Please remove API keys and private code** from anything you paste.

        Found a security problem? Do not use this form. Follow the
        [security policy](https://github.com/BibhabenduMukherjee/HiveMind/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us in your own words.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      description: The exact commands you ran, in order. The smaller the example, the better.
      placeholder: |
        1. Run: hivemind activate
        2. Type: ...
        3. See: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HiveMind version
      description: Run `hivemind --version` and paste what it prints.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Your system
      options:
        - Windows
        - macOS
        - Linux
        - Something else
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: How are you connecting to a model?
      options:
        - HiveMind's hosted service (hivemind auth login)
        - My own API key
        - A model on my own machine
        - Not sure
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Any error text or output
      description: Paste it here. It is formatted as plain text for you.
      render: text
