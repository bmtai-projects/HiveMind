name: Release

# Triggers on a version tag push, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: a tag must clear the same checks as a push to main. Without this,
  # `build` starts immediately and v1.9.18 published from a commit whose CI
  # run was failing. Kept identical to ci.yml's `check` job on purpose.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build (release)
        run: cargo build --workspace --release

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p harness-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "hivemind-${{ matrix.target }}.tar.gz" hivemind
          mv "hivemind-${{ matrix.target }}.tar.gz" "$GITHUB_WORKSPACE/"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/hivemind.exe" -DestinationPath "hivemind-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: hivemind-${{ matrix.target }}
          path: |
            hivemind-${{ matrix.target }}.tar.gz
            hivemind-${{ matrix.target }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One file covering every archive, so a manual download (the only
      # path that can trigger a SmartScreen/Gatekeeper warning today, since
      # neither install script sets Mark-of-the-Web/quarantine) has a way to
      # verify it wasn't tampered with in transit, even before real code
      # signing exists. Filenames in the sums file are relative
      # (`sha256sum *` from inside dist/), matching what `shasum -c` and
      # `Get-FileHash` expect sitting next to the downloaded archive.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      # Publishes to the public BibhabenduMukherjee/HiveMind-releases repo,
      # not this one — this repo is private (source-only). The default
      # GITHUB_TOKEN is scoped to the repo the workflow runs in and cannot
      # write to a different repo, so this needs a PAT with Contents:
      # read/write on HiveMind-releases, stored as the RELEASES_REPO_TOKEN
      # secret here (Settings > Secrets and variables > Actions).
      - name: Publish to public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: BibhabenduMukherjee/HiveMind-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: dist/*
          # NOT generate_release_notes: true -- that calls GitHub's
          # auto-generate-notes endpoint, which 403'd against the
          # fine-grained PAT even with Contents: Read/write (confirmed via
          # the actual run logs, not assumed). A static body avoids the
          # call entirely; the assets are what install.sh actually needs.
          body: "Pre-built `hivemind` binaries for macOS (x86_64/aarch64), Linux (x86_64/aarch64), and Windows (x86_64). Installed via install.sh/install.ps1 by default; if you download an archive directly, verify it against SHA256SUMS.txt (`shasum -a 256 -c SHA256SUMS.txt` / `Get-FileHash`)."
