name: Release

# Triggers on a version tag push, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p harness-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "harness-${{ matrix.target }}.tar.gz" harness
          mv "harness-${{ matrix.target }}.tar.gz" "$GITHUB_WORKSPACE/"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/harness.exe" -DestinationPath "harness-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.target }}
          path: |
            harness-${{ matrix.target }}.tar.gz
            harness-${{ matrix.target }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Publishes to the public BibhabenduMukherjee/HiveMind-releases repo,
      # not this one — this repo is private (source-only). The default
      # GITHUB_TOKEN is scoped to the repo the workflow runs in and cannot
      # write to a different repo, so this needs a PAT with Contents:
      # read/write on HiveMind-releases, stored as the RELEASES_REPO_TOKEN
      # secret here (Settings > Secrets and variables > Actions).
      - name: Publish to public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: BibhabenduMukherjee/HiveMind-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: dist/*
          # NOT generate_release_notes: true -- that calls GitHub's
          # auto-generate-notes endpoint, which 403'd against the
          # fine-grained PAT even with Contents: Read/write (confirmed via
          # the actual run logs, not assumed). A static body avoids the
          # call entirely; the assets are what install.sh actually needs.
          body: "Pre-built `harness` binaries for macOS (x86_64/aarch64), Linux (x86_64/aarch64), and Windows (x86_64)."
