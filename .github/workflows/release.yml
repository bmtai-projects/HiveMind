name: Release

# Triggers on a version tag push, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: a tag must clear the same checks as a push to main. Without this,
  # `build` starts immediately and v1.9.18 published from a commit whose CI
  # run was failing. Kept identical to ci.yml's `check` job on purpose.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build (release)
        run: cargo build --workspace --release

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p harness-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "hivemind-${{ matrix.target }}.tar.gz" hivemind
          mv "hivemind-${{ matrix.target }}.tar.gz" "$GITHUB_WORKSPACE/"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/hivemind.exe" -DestinationPath "hivemind-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: hivemind-${{ matrix.target }}
          path: |
            hivemind-${{ matrix.target }}.tar.gz
            hivemind-${{ matrix.target }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    # Needed to attach assets to this repo's own release. Everything else
    # here reads, so nothing wider is granted.
    permissions:
      contents: write
    # Shared by both publish steps. An env var rather than a YAML anchor:
    # GitHub Actions does not support anchors or aliases.
    env:
      RELEASE_BODY: "Pre-built `hivemind` binaries for macOS (x86_64/aarch64), Linux (x86_64/aarch64), and Windows (x86_64). Installed via install.sh/install.ps1 by default; if you download an archive directly, verify it against SHA256SUMS.txt (`shasum -a 256 -c SHA256SUMS.txt` / `Get-FileHash`)."
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One file covering every archive, so a manual download (the only
      # path that can trigger a SmartScreen/Gatekeeper warning today, since
      # neither install script sets Mark-of-the-Web/quarantine) has a way to
      # verify it wasn't tampered with in transit, even before real code
      # signing exists. Filenames in the sums file are relative
      # (`sha256sum *` from inside dist/), matching what `shasum -c` and
      # `Get-FileHash` expect sitting next to the downloaded archive.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      # The release now lives in this repo. Publishing to itself needs only
      # the default GITHUB_TOKEN, which is why `contents: write` above is
      # enough and no PAT is involved in the primary path.
      #
      # NOT generate_release_notes: true -- that calls GitHub's
      # auto-generate-notes endpoint, which 403'd against a fine-grained PAT
      # even with Contents: Read/write (confirmed from real run logs). A
      # static body avoids the call entirely, and the assets are what the
      # install scripts actually read.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: ${{ env.RELEASE_BODY }}

      # Legacy mirror. Every binary released before the move has
      # `BibhabenduMukherjee/HiveMind-releases` compiled into it (see
      # `update_check::RELEASES_REPO`) and asks *that* repo for the latest
      # version. Without this step those installs would silently answer "you
      # are up to date" forever, because the last release they can see would
      # never change again. Cross-repo writes are outside GITHUB_TOKEN's
      # scope, so this one still needs the RELEASES_REPO_TOKEN PAT.
      #
      # The target is the repo's CURRENT location, not the address baked into
      # those binaries. They ask for `BibhabenduMukherjee/HiveMind-releases`,
      # which now redirects here; reading through a redirect is reliable, but
      # creating a release through one is a POST and may not be followed.
      #
      # It must also stay a *different* repo from the step above. Pointing it
      # at this repo would make it a second publish to the same place and
      # silently strand every older install.
      #
      # Safe to delete once anyone still on a pre-move build is expected to
      # reinstall rather than update.
      - name: Mirror to the legacy releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: bmtai-projects/HiveMind-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: dist/*
          body: ${{ env.RELEASE_BODY }}
