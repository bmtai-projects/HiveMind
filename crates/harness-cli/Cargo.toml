[package]
name = "harness-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "hivemind"
path = "src/main.rs"

[dependencies]
harness-types = { workspace = true }
harness-config = { workspace = true }
harness-provider = { workspace = true }
harness-tools = { workspace = true }
harness-agent = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
reedline = { workspace = true }
walkdir = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
open = { workspace = true }
# `hivemind update`: replaces the currently-running executable in place.
# Hand-rolling this is a trap on Windows specifically -- it locks a running
# .exe against in-place overwrite, and this crate already implements the
# correct rename-then-place workaround rather than reinventing it.
self-replace = "1"
# Extracts the Windows release asset (.zip). Unix's .tar.gz is extracted by
# shelling out to the system `tar`, which every target here ships with, so
# this is Windows-only in practice but built for both to avoid a #[cfg] split
# in the dependency graph itself.
zip = { version = "7", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Test-only: confirms `hooks_config`'s generated `[[hooks]]` blocks are
# actually valid TOML, not just strings that look plausible.
toml = { workspace = true }
