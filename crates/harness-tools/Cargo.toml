[package]
name = "harness-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
harness-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
walkdir = { workspace = true }
reqwest = { workspace = true }
rust_xlsxwriter = "0.96.0"
# default-features off: printpdf's defaults pull in "html" -> a full HTML/CSS
# layout engine (azul-layout) + fontconfig, meant for HTML-to-PDF rendering.
# We only ever emit hand-placed text/lines/rects with the 14 built-in PDF
# fonts (no embedding, no HTML), which needs none of that -- keeps the
# release binary lean across all 5 cross-compiled targets.
printpdf = { version = "0.12.4", default-features = false }
# Text extraction for `read_file`, behind the `pdf` feature. Default features only
# add legacy encrypted-PDF and ICC colour support, which reading text never needs.
pdf_oxide = { version = "0.3", default-features = false, optional = true }

# Only for `kill(-pgid)` in run_shell's process-group reaping (see bash.rs).
# Windows has no process groups and uses `taskkill /T` instead, so this is
# deliberately unix-only rather than a workspace-wide dependency.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Lets `read_file` read the text of PDFs. Off by default: it adds about 15 MB.
pdf = ["dep:pdf_oxide"]
